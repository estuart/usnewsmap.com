[package]
name = "usnm-core"
version = "0.1.0"
description = "US News Map domain types: page keys, time buckets, query language, canonical parameters"
edition.workspace = true
# The code is MIT. The word lists under data/ are data exported from
# wordfreq 3.1.1 (CC BY-SA 4.0, with Google Books Ngram terms), except
# data/damage-words/haw.txt (CC0) and yi.txt (CC BY-SA 4.0): data/README.md.
license = "MIT AND CC-BY-SA-4.0 AND CC0-1.0"
rust-version.workspace = true

[dependencies]
chrono.workspace = true
form_urlencoded.workspace = true
serde.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[features]
# The damage metric and its word lists (12 §12.5 Steps 4 and 5): off by
# default, so the API binary doesn't embed the lists.
damage = []

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
